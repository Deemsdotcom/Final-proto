# Streamlit theme — Capgemini Invent dark palette
#
# Uses a deep navy background with bright Capgemini blues for highlights
# and CTAs. Most page-level styling is also injected via CSS in
# views/_design.py (theme tokens here are only what Streamlit's built-in
# theming system exposes).

[theme]
base = "dark"

# Bright electric blue used for primary buttons, sliders, focus rings.
# Matches the "Begin Game" CTA in the design reference.
primaryColor = "#1493D4"

# Deep navy page background.
backgroundColor = "#0B1729"

# Slightly lighter navy used by Streamlit for cards, expanders, sidebar.
secondaryBackgroundColor = "#1A2740"

# Primary text color (white on dark surfaces).
textColor = "#FFFFFF"

font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
