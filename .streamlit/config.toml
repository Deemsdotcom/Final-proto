# Streamlit theme — Capgemini Invent Dark 2026
# Tokens sourced from 20260414_Agentic_AI_in_Action_Swiss_Stories.pptx theme XML

[theme]
base = "dark"

# Official Capgemini primary blue
primaryColor = "#0058AB"

# Official Capgemini deep navy
backgroundColor = "#121A38"

# Slightly lighter navy for Streamlit-managed card surfaces
secondaryBackgroundColor = "#1A2548"

# Primary text
textColor = "#FFFFFF"

font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
